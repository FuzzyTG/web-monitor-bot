name: Microsoft Edge Competitive Intelligence

on:
  schedule:
    # Runs every 24 hours at 9 AM UTC (optimal for blog monitoring)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  competitive-intelligence:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install UV Package Manager
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.lock"
    
    - name: Set up Python and Virtual Environment
      run: |
        uv python install 3.12
        uv venv
        source .venv/bin/activate
    
    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -r requirements.lock
    
    - name: Run Production Pipeline
      run: |
        source .venv/bin/activate
        export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
        export EMAIL_USERNAME="${{ secrets.EMAIL_USERNAME }}"
        export EMAIL_PASSWORD="${{ secrets.EMAIL_PASSWORD }}"
        export EMAIL_TO="${{ secrets.EMAIL_TO }}"
        export SMTP_SERVER="${{ secrets.SMTP_SERVER }}"
        export SMTP_PORT=587
        export CUSTOM_AI_PROMPT="${{ secrets.CUSTOM_AI_PROMPT }}"
        python -c "from production_pipeline import production_monitoring_pipeline; import sys; success = production_monitoring_pipeline(); sys.exit(0 if success else 1)"
