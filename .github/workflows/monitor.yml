name: Microsoft Edge Competitive Intelligence

on:
  schedule:
    # Runs every 24 hours at 9 AM UTC (optimal for blog monitoring)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  competitive-intelligence:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install UV Package Manager
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        cache-dependency-glob: "requirements.lock"
    
    - name: Set up Python and Virtual Environment
      run: |
        uv python install 3.12
        uv venv
        source .venv/bin/activate
    
    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -r requirements.lock
    
    - name: Check Secrets Availability
      run: |
        echo "Checking if secrets are available (will show true/false):"
        echo "GEMINI_API_KEY set: ${{ secrets.GEMINI_API_KEY != '' }}"
        echo "EMAIL_USERNAME set: ${{ secrets.EMAIL_USERNAME != '' }}"
        echo "EMAIL_PASSWORD set: ${{ secrets.EMAIL_PASSWORD != '' }}"
        echo "EMAIL_TO set: ${{ secrets.EMAIL_TO != '' }}"
        echo "SMTP_SERVER set: ${{ secrets.SMTP_SERVER != '' }}"
        echo "CUSTOM_AI_PROMPT set: ${{ secrets.CUSTOM_AI_PROMPT != '' }}"

    - name: Run Production Pipeline
      if: ${{ secrets.GEMINI_API_KEY != '' }}
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        SMTP_PORT: "587"
        CUSTOM_AI_PROMPT: ${{ secrets.CUSTOM_AI_PROMPT }}
      run: |
        source .venv/bin/activate
        python -c "from production_pipeline import production_monitoring_pipeline; import sys; success = production_monitoring_pipeline(); sys.exit(0 if success else 1)"
