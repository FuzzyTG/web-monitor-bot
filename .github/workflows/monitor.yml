name: Microsoft Edge Competitive Intelligence

on:
  schedule:
    # Runs every 24 hours at 9 AM UTC (optimal for blog monitoring)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  competitive-intelligence:
    runs-on: ubuntu-latest
    
    # CHANGE 1: The 'env' block is moved to the job level.
    # This makes all variables (from secrets and plaintext) available to all steps.
    # This is cleaner and avoids repetition.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: "587"
      CUSTOM_AI_PROMPT: ${{ secrets.CUSTOM_AI_PROMPT }}

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step 2: Set up the UV tool
      # CHANGE 2: Updated to the stable v1 release and modern caching.
      - name: Set up UV
        uses: astral-sh/setup-uv@v1
        with:
          cache-key: ${{ runner.os }}-uv-${{ hashFiles('**/requirements.lock') }}

      # Step 3: Install Python and dependencies
      # CHANGE 3: Combined into a single step to ensure the virtual environment
      # is correctly activated for the dependency installation command.
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv venv
          source .venv/bin/activate
          echo "VENV activated. Installing dependencies..."
          uv pip install -r requirements.lock
          echo "Dependencies installed."

      # Step 4: Run the production pipeline
      # CHANGE 4: This step now correctly sources the venv before running the Python code.
      # It automatically inherits all environment variables from the job-level 'env' block.
      - name: Run Production Pipeline
        run: |
          source .venv/bin/activate
          echo "VENV activated. Running production script..."
          python -c "from production_pipeline import production_monitoring_pipeline; import sys; success = production_monitoring_pipeline(); sys.exit(0 if success else 1)"
