name: Microsoft Edge Competitive Intelligence

on:
  schedule:
    # Run daily at 9 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  workflow_dispatch:
    # Allow manual triggering with options
    inputs:
      notification_type:
        description: 'Type of notification to send'
        required: false
        default: 'new_posts'
        type: choice
        options:
          - new_posts
          - test
      force_analysis:
        description: 'Force analysis of all posts (not just new ones)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "intelligence-monitoring"
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    environment: web-monitor-bot
    
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-pro' }}
      EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: "587"
      CUSTOM_AI_PROMPT: ${{ secrets.CUSTOM_AI_PROMPT }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      REPORTS_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      MAX_REPORTS_TO_KEEP: ${{ secrets.MAX_REPORTS_TO_KEEP || '30' }}
      REPORTS_CLEANUP_DAYS: ${{ secrets.REPORTS_CLEANUP_DAYS || '30' }}
      NOTIFICATION_TYPE: ${{ github.event.inputs.notification_type || 'new_posts' }}
      FORCE_ANALYSIS: ${{ github.event.inputs.force_analysis || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up UV
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Configure Git
        run: |
          git config --global user.name "Competitive Intelligence Bot"
          git config --global user.email "ci-bot@microsoft.com"

      - name: Install dependencies and run monitoring
        run: |
          echo "🚀 Starting Microsoft Edge Competitive Intelligence Monitoring"
          echo "Repository: $GITHUB_REPO"
          echo "Reports URL: $REPORTS_BASE_URL"
          echo "AI Model: $GEMINI_MODEL"
          echo "Notification Type: $NOTIFICATION_TYPE"
          echo "Force Analysis: $FORCE_ANALYSIS"
          echo "Max Reports: $MAX_REPORTS_TO_KEEP"
          
          # Install dependencies
          uv sync
          
          # Run the monitoring pipeline
          if [ "$FORCE_ANALYSIS" = "true" ]; then
            echo "🔄 Running with force analysis (all posts)"
            uv run python production_pipeline.py --force
          else
            echo "🔍 Running normal monitoring (new posts only)"
            uv run python production_pipeline.py
          fi

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './reports'

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Cleanup old reports
        if: always()
        run: |
          echo "🧹 Cleaning up reports older than 30 days"
          uv run python -c "
          try:
              from report_publisher import cleanup_old_reports
              success, count, error = cleanup_old_reports(30)
              if success:
                  print(f'✅ Cleaned up {count} old reports')
              else:
                  print(f'⚠️ Cleanup failed: {error}')
          except Exception as e:
              print(f'⚠️ Cleanup skipped: {e}')
          "

      - name: Create monitoring summary
        if: always()
        run: |
          echo "📊 MONITORING SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "===================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reports Site:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ **Status:** Monitoring completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Monitoring failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Check the logs above for detailed monitoring results." >> $GITHUB_STEP_SUMMARY
