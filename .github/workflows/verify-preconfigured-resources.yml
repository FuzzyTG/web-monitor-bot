name: Multi-Environment Workflow Example

on:
  workflow_dispatch:

jobs:
  # Job 1: This job is configured to run in your 'Verification' environment
  run-verification-task:
    runs-on: ubuntu-latest
    
    # This line explicitly tells the job to use the 'Verification' environment.
    # It will now have access to the 1 secret you configured there.
    environment: Verification
    
    steps:
      - name: Execute verification step
        run: |
          echo "This job is running in the 👉 ${{ github.environment }} 👈 environment."
          echo "Attempting to use the secret from this environment..."
          
          # Replace 'YOUR_VERIFICATION_SECRET_NAME' with the actual name of your secret.
          if [ -n "${{ secrets.YOUR_VERIFICATION_SECRET_NAME }}" ]; then
            echo "✅ SUCCESS: Secret from 'Verification' environment was loaded."
          else
            echo "❌ FAILURE: Could not load the secret from the 'Verification' environment."
            exit 1
          fi

  # Job 2: This job is configured to run in your 'web-monitor-bot' environment
  run-monitor-bot:
    runs-on: ubuntu-latest
    
    # This line explicitly tells the job to use the 'web-monitor-bot' environment.
    # It will now have access to the 5 secrets you configured there.
    environment: web-monitor-bot
    
    steps:
      - name: Execute web monitor task
        run: |
          echo "This job is running in the 👉 ${{ github.environment }} 👈 environment."
          echo "Attempting to use a secret from the bot's environment..."
          
          # Replace 'YOUR_BOT_SECRET_NAME' with one of the actual names of your 5 secrets.
          if [ -n "${{ secrets.YOUR_BOT_SECRET_NAME }}" ]; then
            echo "✅ SUCCESS: Secret from 'web-monitor-bot' environment was loaded."
          else
            echo "❌ FAILURE: Could not load the secret from the 'web-monitor-bot' environment."
            exit 1
          fi
