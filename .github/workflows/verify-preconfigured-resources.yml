name: Verify Access to Preconfigured Resources

on:
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  resource-validation-job:
    runs-on: ubuntu-latest
    steps:
      - name: "Step 1: Read Custom Secrets and Variables"
        run: |
          echo "--- Verifying access to user-configured resources ---"
          
          echo "Attempting to read MY_TEST_SECRET..."
          if [ -n "${{ secrets.MY_TEST_SECRET }}" ]; then
            echo "✅ SUCCESS: Secret 'MY_TEST_SECRET' was accessed. Value is redacted by GitHub."
          else
            echo "❌ FAILURE: Secret 'MY_TEST_SECRET' could not be read. Ensure it is configured in repository settings."
            exit 1
          fi

          echo
          echo "Attempting to read MY_TEST_VARIABLE..."
          # Note: It is safe to print repository variables. They are not redacted.
          if [ -n "${{ vars.MY_TEST_VARIABLE }}" ]; then
            echo "✅ SUCCESS: Variable 'MY_TEST_VARIABLE' has the value: '${{ vars.MY_TEST_VARIABLE }}'"
          else
            echo "❌ FAILURE: Variable 'MY_TEST_VARIABLE' could not be read. Ensure it is configured."
            exit 1
          fi
          echo "-----------------------------------------------------"

      - name: "Step 2: Read Default GitHub Environment Variables"
        run: |
          echo "--- Verifying access to default GitHub variables ---"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Workflow Triggered By: $GITHUB_ACTOR"
          echo "Runner OS: $RUNNER_OS"
          echo "GitHub Run ID: $GITHUB_RUN_ID"
          echo "--------------------------------------------------"

      - name: "Step 3: Verify Pre-installed Software Tools"
        run: |
          echo "--- Verifying availability of common pre-installed tools ---"
          echo "Checking Git version..."
          git --version
          echo
          echo "Checking Python version..."
          python3 --version
          echo
          echo "Checking Node.js version..."
          node --version
          echo
          echo "Checking cURL version..."
          curl --version
          echo "----------------------------------------------------------"

      - name: "Step 4: Verify Access to Repository Code (after checkout)"
        uses: actions/checkout@v4
      - run: |
          echo "--- Verifying access to checked-out repository files ---"
          echo "Listing files and directories in the workspace root:"
          ls -la
          echo "--------------------------------------------------------"
