[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microsoft-edge-competitive-intelligence"
version = "1.0.0"
description = "Advanced competitive intelligence system for monitoring Chrome Enterprise blog posts"
authors = [
    {name = "Microsoft Edge Team", email = "edge-competitive-intel@microsoft.com"},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business :: News/Diary",
]
keywords = ["competitive-intelligence", "blog-monitoring", "ai-analysis", "microsoft-edge"]

dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.2",
    "google-generativeai>=0.3.2",
    "lxml>=4.9.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/alexyuan_microsoft/web-monitor-bot"
Repository = "https://github.com/alexyuan_microsoft/web-monitor-bot"
Issues = "https://github.com/alexyuan_microsoft/web-monitor-bot/issues"

[project.scripts]
competitive-intel = "production_pipeline:main"

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
