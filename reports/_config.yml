title: "Microsoft Edge Competitive Intelligence"
description: "Automated competitive intelligence monitoring system for Microsoft Edge"
baseurl: "/web-monitor-bot/reports"
url: "https://fuzzytg.github.io"

# Jekyll settings
markdown: kramdown
highlighter: rouge
theme: minima

# Process all markdown files as pages
plugins:
  - jekyll-optional-front-matter

# Defaults  
defaults:
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude files
exclude:
  - README.md
  - templates/
  - generated/

# Include markdown files
include:
  - "*.md"

